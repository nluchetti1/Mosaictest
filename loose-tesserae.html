<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loose Tesserae</title>
<style>
:root{color-scheme:dark;--ink:#050403;--gold:#e8c476;--text:#efe4cc;--mute:#a89a7e;--serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);overflow:hidden;}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ink);}
#frame{position:relative;width:min(100vw,100vh);height:min(100vw,100vh);}
canvas{display:block;width:100%;height:100%;background:#000;}
#card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:radial-gradient(ellipse at 50% 50%,rgba(5,4,3,.35),rgba(5,4,3,.82));padding:24px;box-sizing:border-box;}
#card h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,6.5vmin,64px);letter-spacing:.08em;margin:0;color:var(--gold);text-shadow:0 2px 18px rgba(0,0,0,.6);}
#card p{font-family:var(--serif);font-style:italic;font-size:clamp(14px,2.3vmin,19px);margin:0;color:var(--text);opacity:.85;max-width:34ch;}
#playBtn{margin-top:10px;font-family:var(--sans);font-size:clamp(14px,2.2vmin,17px);letter-spacing:.14em;text-transform:uppercase;color:#1a1206;background:linear-gradient(180deg,#f3d58f,#c99a45);border:0;border-radius:999px;padding:13px 26px;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.5);}
#playBtn:hover{filter:brightness(1.07);}
#card small{font-family:var(--sans);font-size:12px;color:var(--mute);letter-spacing:.06em;}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:22px 14px 12px;background:linear-gradient(0deg,rgba(0,0,0,.7),rgba(0,0,0,0));font-family:var(--sans);font-size:13px;opacity:0;transition:opacity .35s;}
#frame.show #bar,#frame.paused #bar{opacity:1;}
#bar button{font-family:var(--sans);font-size:13px;color:var(--text);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:5px 10px;cursor:pointer;min-width:36px;}
#track{flex:1;height:18px;display:flex;align-items:center;cursor:pointer;}
#track div{position:relative;height:3px;width:100%;background:rgba(255,255,255,.2);border-radius:2px;}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gold);border-radius:2px;}
#time{font-variant-numeric:tabular-nums;color:var(--mute);min-width:84px;text-align:right;}
button:focus-visible,#track:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:var(--serif);font-size:18px;color:var(--text);}
@media (prefers-reduced-motion:reduce){#bar{transition:none;}}
</style>

</head>
<body>
<div id="stage">
  <div id="frame" class="paused">
    <canvas id="c" aria-label="Loose Tesserae, an animated film"></canvas>
    <div id="card">
      <h1>Loose Tesserae</h1>
      <p>An eighty-second film in glass and gold leaf, for a mosaic whose tiles were never glued down.</p>
      <button id="playBtn" type="button">Play with sound</button>
      <small>Space plays or pauses · R restarts · M mutes</small>
    </div>
    <div id="bar">
      <button id="pp" type="button" aria-label="Play or pause">▶</button>
      <button id="rs" type="button" aria-label="Restart">↺</button>
      <div id="track" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="80" aria-valuenow="0"><div><span id="fill"></span></div></div>
      <span id="time">0:00 / 1:20</span>
      <button id="snd" type="button" aria-label="Toggle sound">Sound on</button>
    </div>
    <div id="err">This film needs WebGL2, which this browser didn’t provide.</div>
  </div>
</div>

const sdx = new Float32Array(N), sdy = new Float32Array(N), sdz = new Float32Array(N), fx = new Float32Array(N), fy = new Float32Array(N), fz = new Float32Array(N);

// ======================================================================
// the starship's path (sampled once)
// ======================================================================
function crSpline(K, t, zeroStart, zeroEnd) {
  let k = 0; while (k < K.length - 2 && t > K[k + 1][0]) k++;

let AC = null, master, dry, wet, clickWet, padFilter, padGain, padVoices = [], drone1, drone2, whooshGain, whooshFilter, clickBufs = [], soundOn = true, curChord = -1;
const CHORDS = [[0, [73.42, 146.83, 220, 293.66, 349.23]], [14, [58.27, 116.54, 174.61, 293.66, 349.23]], [27, [87.31, 130.81, 174.61, 220, 261.63]], [36.5, [49, 98, 146.83, 196, 233.08]], [45.6, [55, 110, 164.81, 220, 293.66]], [58.8, [73.42, 146.83, 220, 293.66, 369.99]], [71.4, [73.42, 146.83, 220, 369.99, 440]]];
const BELLS = [[6.2, 587.33], [17.9, 880], [27.3, 698.46], [45.6, 440], [58.8, 587.33], [71.4, 739.99], [74.8, 587.33], [75.3, 880]];
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; return; }
  const sr = AC.sampleRate;
  master = AC.createGain(); master.gain.value = 0;
  const comp = AC.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.2;
  master.connect(comp); comp.connect(AC.destination);
  const ir = AC.createBuffer(2, Math.floor(sr * 3.4), sr);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let k = 0; k < d.length; k++) { const tt = k / sr; d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / d.length, 2.2) * (tt < 0.08 ? 0.6 + Math.random() * 0.8 : 1); } }
  const rev = AC.createConvolver(); rev.buffer = ir;
  wet = AC.createGain(); wet.gain.value = 0.55; wet.connect(rev); rev.connect(master);
  dry = AC.createGain(); dry.gain.value = 1; dry.connect(master);
  clickWet = AC.createGain(); clickWet.gain.value = 0.5; clickWet.connect(wet);
  padFilter = AC.createBiquadFilter(); padFilter.type = 'lowpass'; padFilter.frequency.value = 850; padFilter.Q.value = 0.6;
  padGain = AC.createGain(); padGain.gain.value = 0.05; padFilter.connect(padGain); padGain.connect(dry); padGain.connect(wet);
  for (let v = 0; v < 4; v++) { const g = AC.createGain(); g.gain.value = 0.22; g.connect(padFilter); const os = []; for (const det of [-7, 7]) { const o = AC.createOscillator(); o.type = 'sawtooth'; o.detune.value = det + (Math.random() - 0.5) * 4; o.frequency.value = 220; o.connect(g); o.start(); os.push(o); } padVoices.push(os); }
  const lfo = AC.createOscillator(); lfo.frequency.value = 0.06; const lg = AC.createGain(); lg.gain.value = 320; lfo.connect(lg); lg.connect(padFilter.frequency); lfo.start();
  drone1 = AC.createOscillator(); drone1.type = 'sine'; const dg = AC.createGain(); dg.gain.value = 0.13; drone1.connect(dg); dg.connect(dry); drone1.start();
  drone2 = AC.createOscillator(); drone2.type = 'triangle'; const dg2 = AC.createGain(); dg2.gain.value = 0.028; drone2.connect(dg2); dg2.connect(dry); dg2.connect(wet); drone2.start();
  const nb = AC.createBuffer(1, sr * 2, sr); const nd = nb.getChannelData(0); for (let k = 0; k < nd.length; k++) nd[k] = Math.random() * 2 - 1;
  const ns = AC.createBufferSource(); ns.buffer = nb; ns.loop = true;
  whooshFilter = AC.createBiquadFilter(); whooshFilter.type = 'bandpass'; whooshFilter.frequency.value = 500; whooshFilter.Q.value = 0.7;
  whooshGain = AC.createGain(); whooshGain.gain.value = 0; ns.connect(whooshFilter); whooshFilter.connect(whooshGain); whooshGain.connect(dry); whooshGain.connect(wet); ns.start();
  for (let k = 0; k < 8; k++) {
    const len = Math.floor(sr * 0.07), b = AC.createBuffer(1, len, sr), d = b.getChannelData(0);
    const f1 = 2600 + k * 420 + Math.random() * 200, f2 = f1 * (2.6 + Math.random() * 0.4); let prevN = 0;
    for (let s = 0; s < len; s++) { const tt = s / sr, n = Math.random() * 2 - 1, hp = n - prevN; prevN = n; d[s] = hp * Math.exp(-tt / 0.0035) * 0.55 + Math.sin(TAU * f1 * tt) * Math.exp(-tt / 0.016) * 0.42 + Math.sin(TAU * f2 * tt) * Math.exp(-tt / 0.008) * 0.2; }
    clickBufs.push(b);
  }
}
function setChord(t, instant) {
  if (!AC) return; let k = 0; while (k < CHORDS.length - 1 && t >= CHORDS[k + 1][0]) k++;
  if (k === curChord && !instant) return; curChord = k;
  const f = CHORDS[k][1], now = AC.currentTime, tc = instant ? 0.02 : 1.3;
  drone1.frequency.setTargetAtTime(f[0], now, tc); drone2.frequency.setTargetAtTime(f[0] * 2, now, tc);
  padVoices.forEach((os, v) => os.forEach(o => o.frequency.setTargetAtTime(f[v + 1], now, tc)));
}
function bell(freq, vol) {
  if (!AC) return; const now = AC.currentTime;
  [[1, 3.6, 1], [2.0, 2.6, 0.45], [2.76, 1.8, 0.35], [5.4, 0.9, 0.18]].forEach(([m, dec, a]) => {
    const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.value = freq * m;
    g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(vol * a, now + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, now + dec);
    o.connect(g); g.connect(dry); g.connect(wet); o.start(now); o.stop(now + dec + 0.05);
  });
}
function clicks(n, xs, frameDt) {
  if (!AC || n === 0) return;
  const now = AC.currentTime, count = Math.min(5, n), vol = clamp(0.16 * Math.sqrt(Math.max(1, n / count)), 0.12, 0.42);
  for (let k = 0; k < count; k++) {
    const s = AC.createBufferSource(); s.buffer = clickBufs[(Math.random() * clickBufs.length) | 0]; s.playbackRate.value = 0.75 + Math.random() * 0.7;
    const g = AC.createGain(); g.gain.value = vol * (0.6 + Math.random() * 0.5);
    const p = AC.createStereoPanner ? AC.createStereoPanner() : null;
    s.connect(g); if (p) { p.pan.value = clamp((xs[k % Math.max(1, xs.length)] || 0) * 0.85, -1, 1); g.connect(p); p.connect(dry); p.connect(clickWet); } else { g.connect(dry); g.connect(clickWet); }
    s.start(now + 0.005 + Math.random() * frameDt);
  }
}
function updateAudio(t, playing, dt) {
  if (!AC) return; const now = AC.currentTime;
  const target = playing && soundOn ? 0.9 * (0.25 + 0.75 * fadeAt(t)) : 0;
  master.gain.setTargetAtTime(target, now, playing ? 0.15 : 0.05);
  if (!playing) { whooshGain.gain.setTargetAtTime(0, now, 0.05); return; }
  setChord(t, false);
  padGain.gain.setTargetAtTime(0.045 + 0.03 * smooth(45, 50, t) * (1 - smooth(58, 64, t)), now, 0.5);
  const s1 = shipState(t, SHT), s2 = shipState(t + 0.05, { ...SHT });
  let sp = Math.hypot(s2.x - s1.x, s2.y - s1.y, s2.z - s1.z) / 0.05;
  const shipVis = (t > 8 && t < 45) || (t > 66 && t < 72) ? 1 : 0;
  const vort = smooth(45.6, 48, t) * (1 - smooth(60, 66, t)), comet = smooth(17.5, 18.5, t) * (1 - smooth(24, 25.5, t));
  const lvl = clamp(sp * 0.35 * shipVis + vort * 0.22 + comet * 0.14, 0, 0.5);
  whooshGain.gain.setTargetAtTime(lvl * 0.35, now, 0.12); whooshFilter.frequency.setTargetAtTime(280 + 1400 * lvl, now, 0.15);
}

// ======================================================================
// playback
// ======================================================================
let t = 76, playing = false, started = false, needsDraw = true, last = performance.now(), idleT = 0, perfAcc = 0, perfN = 0;
const frame = $('#frame');
function fmt(s) { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function updateUI() {
  $('#fill').style.width = (t / DUR * 100) + '%';
  $('#time').textContent = fmt(t) + ' / ' + fmt(DUR);
  $('#track').setAttribute('aria-valuenow', t.toFixed(1));
  $('#pp').textContent = playing ? '❚❚' : '▶';
  frame.classList.toggle('paused', !playing && started);
}
function seek(nt) { t = clamp(nt, 0, DUR); updateTiles(t, true); curChord = -1; if (AC && playing) setChord(t, true); needsDraw = true; updateUI(); }
function play() {
  initAudio();
  if (!started) { started = true; $('#card').style.display = 'none'; seek(0); }
  if (t >= DUR - 0.01) seek(0);
  playing = true; last = performance.now(); if (AC) setChord(t, true); updateUI(); pokeUI();
}
function pause() { playing = false; updateUI(); }
function toggle() { playing ? pause() : play(); }
function pokeUI() { frame.classList.add('show'); idleT = 2.5; }
$('#playBtn').addEventListener('click', play);
$('#pp').addEventListener('click', () => { if (!started) play(); else toggle(); });
$('#rs').addEventListener('click', () => { if (!started) play(); else { seek(0); if (!playing) play(); } });
$('#snd').addEventListener('click', () => { soundOn = !soundOn; $('#snd').textContent = soundOn ? 'Sound on' : 'Sound off'; if (soundOn) initAudio(); });
const track = $('#track');
function trackSeek(e) { const r = track.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * DUR); if (!started) { started = true; $('#card').style.display = 'none'; } }
let dragging = false;
track.addEventListener('pointerdown', e => { dragging = true; track.setPointerCapture(e.pointerId); trackSeek(e); });
track.addEventListener('pointermove', e => { if (dragging) trackSeek(e); });
track.addEventListener('pointerup', () => { dragging = false; });
track.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { seek(t + 5); e.preventDefault(); } if (e.key === 'ArrowLeft') { seek(t - 5); e.preventDefault(); } });
frame.addEventListener('pointermove', pokeUI);
canvas.addEventListener('click', () => { if (started) toggle(); });
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'BUTTON' && (e.code === 'Space' || e.code === 'Enter')) return;
  if (e.code === 'Space') { e.preventDefault(); started ? toggle() : play(); pokeUI(); }
  else if (e.code === 'KeyR') { if (!started) play(); else { seek(0); if (!playing) play(); } }
  else if (e.code === 'KeyM') $('#snd').click();
  else if (e.code === 'ArrowRight' && e.target === document.body) seek(t + 5);
  else if (e.code === 'ArrowLeft' && e.target === document.body) seek(t - 5);
});
addEventListener('resize', () => { needsDraw = true; });
document.addEventListener('visibilitychange', () => { last = performance.now(); });

function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000; last = now; if (dt > 0.1) dt = 0.1;
  if (playing) {
    perfAcc += dt; perfN++;
    if (perfAcc > 2) { const avg = perfAcc / perfN; if (avg > 0.034 && quality > 0.55) quality -= 0.1; else if (avg < 0.02 && quality < 1) quality = Math.min(1, quality + 0.05); perfAcc = 0; perfN = 0; }
    const prevT = t; t += dt;
    for (const [bt, bf] of BELLS) if (prevT < bt && t >= bt && soundOn) bell(bf, bt > 74 ? 0.07 : 0.055);
    if (t >= DUR) { t = DUR; playing = false; frame.classList.add('show'); }
    updateTiles(t, false);
    if (soundOn) clicks(landCount, landXs, dt);
    needsDraw = true;
    if (idleT > 0) { idleT -= dt; if (idleT <= 0) frame.classList.remove('show'); }
    updateUI();
  }
  updateAudio(t, playing, dt);
  if (needsDraw) { render(t); needsDraw = false; }
}
// poster frame: the finished wall
updateTiles(t, true); updateUI();
window.__film = { seek: s => { seek(s); render(t); }, get t() { return t; } };
requestAnimationFrame(loop);
})();
</script>
